# Render Blueprint — the Rolio API (apps/backend).
# The frontend deploys separately on Vercel; the database is Supabase.
#
# First deploy: in the Render dashboard, create a new Blueprint from this repo,
# then fill in the secret env vars below (DATABASE_URL, JWT_SECRET, FRONTEND_URL,
# and optionally GEMINI_API_KEY). See DEPLOYING.md.

services:
  - type: web
    name: rolio-api
    runtime: node
    plan: free
    # Frankfurt — closest Render region to the Supabase project (eu-west-1)
    region: frankfurt
    autoDeployTrigger: commit
    branch: main
    healthCheckPath: /health
    # --include=dev: NODE_ENV=production (below) makes a bare `npm ci` skip
    # devDependencies, and the Nest CLI + TypeScript needed to build live there
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w backend &&
      ( cd apps/backend && npx prisma migrate deploy )
    startCommand: node apps/backend/dist/main
    envVars:
      - key: NODE_VERSION
        value: "20"
      # governs the refresh-token cookie's Secure/SameSite flags (frontend and
      # API are cross-site in production, so the cookie needs SameSite=None)
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # optional — enables AI interview prep (free key: aistudio.google.com/apikey)
      - key: GEMINI_API_KEY
        sync: false
      # optional — enables the daily email digest (free key: resend.com)
      - key: RESEND_API_KEY
        sync: false
      # shared secret the GitHub Actions cron sends to POST /internal/digest —
      # generate any random string and put the same value in the repo's
      # DIGEST_SECRET GitHub Actions secret
      - key: DIGEST_SECRET
        sync: false
      # optional — enables "Continue with Google" (free: console.cloud.google.com)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # must match the authorized redirect URI on the Google OAuth client,
      # e.g. https://rolio-api.onrender.com/auth/google/callback
      - key: GOOGLE_CALLBACK_URL
        sync: false
